name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build website
        env:
          PORT: 5173
          BASE_PATH: /Portfolio/
        run: pnpm --filter @workspace/kriti-portfolio run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/kriti-portfolio/dist/public

      - id: deployment
        uses: actions/deploy-pages@v4
